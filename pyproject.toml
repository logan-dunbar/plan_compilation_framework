[project]
name = "plan-compilation-framework"
version = "0.2.0"
description = "Plan Compilation Framework: compiles a planner's policy into a model-free value function that reduces the planning horizon over repeated use."
authors = [{ name = "Logan Dunbar", email = "logan.dunbar@gmail.com" }]
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "tqdm>=4.66",
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plan_compilation_framework"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
